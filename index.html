
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css" />

<div class="app-container">
    <!-- En-tête -->
    <header class="app-header">
      <div class="brand">
        <div class="status-dot"></div>
        <span>AURA // v0.2</span>
      </div>
      <div class="header-controls">
        <button class="btn-icon" id="closeBtn" title="Fermer">×</button>
      </div>
    </header>

    <!-- Mascotte & Dialogue Interactif -->
    <section class="mascot-section">
      <div class="speech-bubble" id="speechBubble">
        Salut ! Clique sur moi pour discuter ou change de mode ci-dessous.
      </div>
      <div class="mascot-avatar" id="mascotAvatar" title="Clique-moi !">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="45" fill="#1e1b4b" stroke="#818cf8" stroke-width="3"/>
          <rect x="25" y="32" width="50" height="32" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
          <circle cx="38" cy="48" r="5" fill="#38bdf8" id="leftEye"/>
          <circle cx="62" cy="48" r="5" fill="#38bdf8" id="rightEye"/>
        </svg>
      </div>
    </section>

    <!-- Sélecteur d'onglets interactif -->
    <nav class="mode-selector">
      <button class="mode-btn active" data-target="workPanel">🧠 Travail</button>
      <button class="mode-btn" data-target="sleepPanel">🌙 Sommeil</button>
    </nav>

    <!-- Contenu dynamique -->
    <div class="panel-container">
      
      <!-- Panel Travail -->
      <div class="panel active" id="workPanel">
        <div class="timer-display" id="timerDisplay">25:00</div>
        <div class="timer-controls">
          <button class="btn btn-primary" id="startTimer">Démarrer</button>
          <button class="btn btn-secondary" id="resetTimer">Reset</button>
        </div>
        <div class="console-box" id="consoleLog">
          > Système prêt. En attente d'action...
        </div>
      </div>

      <!-- Panel Sommeil -->
      <div class="panel" id="sleepPanel">
        <div class="routine-card">
          <h3>Routine de Coucher (Cible : 23:00)</h3>
          <ul class="checklist">
            <li><label><input type="checkbox"> Couper les écrans intenses</label></li>
            <li><label><input type="checkbox"> Préparer tisane / thé au miel</label></li>
            <li><label><input type="checkbox"> Baisser la luminosité</label></li>
          </ul>
        </div>
      </div>

    </div>
  </div>
  
  <!-- Scripts JS -->
  <script src="./js/mascot.js"></script>
  <script src="./js/routine.js"></script>
  <script src="./js/app.js"></script>
  </head>
</html>
